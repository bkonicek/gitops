name: Argo CD Diff Preview

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: pull-request

      - uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Generate Diff
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output:/output \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            -e LINE_COUNT=3 \
            -e DEBUG=true \
            -e KEEP_CLUSTER_ALIVE=true \
            dagandersen/argocd-diff-preview:v0.2.16

      - name: Dump cluster diagnostics
        if: failure()
        run: |
          kind export kubeconfig --name argocd-diff-preview
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl -n argocd describe pods -l app.kubernetes.io/component=redis || true
          kubectl -n argocd logs -l app.kubernetes.io/component=redis --all-containers --tail=100 || true
          kubectl -n argocd get jobs,pods || true
          kubectl -n argocd describe pods || true

      - name: Post diff as comment
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
