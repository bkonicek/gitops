apiVersion: batch/v1
kind: CronJob
metadata:
  name: actualbudget-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: tar-data
              image: {{ .Values.backup.busyboxImage }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  # user-files only gets entries once a budget has actually synced (each is
                  # written as file-<id>.blob by the sync-upload endpoint). account.sqlite is
                  # NOT a reliable signal here -- actual-server lazily creates it on the first
                  # request that touches account state (e.g. the frontend's bootstrap-status
                  # check on load), so it exists within seconds of a fresh empty volume too.
                  # Refuse to back up (and overwrite the remote backup) an empty/uninitialized
                  # volume, e.g. right after a node replacement recreates the PV from scratch.
                  if [ -z "$(ls -A /data/user-files 2>/dev/null)" ]; then
                    echo "Refusing to back up: /data/user-files is empty, data volume looks uninitialized (no budget files yet)." >&2
                    exit 1
                  fi
                  tar -czf /backup/actualbudget-backup.tar.gz -C /data .
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: {{ .Values.backup.ociCliImage }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  NAMESPACE=$(oci os ns get --auth instance_principal --region {{ .Values.backup.region }} --query data --raw-output)
                  oci os object put --auth instance_principal --region {{ .Values.backup.region }} \
                    --namespace "$NAMESPACE" \
                    --bucket-name {{ .Values.backup.bucket }} \
                    --name {{ .Values.backup.objectName }} \
                    --file /backup/actualbudget-backup.tar.gz \
                    --force
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-data
            - name: backup
              emptyDir: {}
