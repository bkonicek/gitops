apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnpg-database.fullname" . }}
  labels:
    {{- include "cnpg-database.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cluster.instances }}

  {{- with .Values.cluster.imageName }}
  imageName: {{ . }}
  {{- end }}

  storage:
    size: {{ .Values.cluster.storage.size | quote }}
    {{- with .Values.cluster.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  {{- with .Values.cluster.superuserSecret }}
  superuserSecret:
    name: {{ . }}
  {{- end }}
  enableSuperuserAccess: {{ .Values.cluster.enableSuperuserAccess }}

  bootstrap:
    initdb:
      database: {{ .Values.cluster.bootstrap.database }}
      owner: {{ .Values.cluster.bootstrap.owner }}

  {{- with .Values.cluster.postgresql }}
  postgresql:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  monitoring:
    enablePodMonitor: {{ .Values.cluster.monitoring.enablePodMonitor }}

  {{- with .Values.cluster.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
