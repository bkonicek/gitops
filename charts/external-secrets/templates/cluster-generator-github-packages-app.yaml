{{- if and .Values.githubPackagesApp.appID .Values.githubPackagesApp.installID }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-packages-app
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: {{ .Values.githubPackagesApp.appID | quote }}
      installID: {{ .Values.githubPackagesApp.installID | quote }}
      permissions:
        packages: read
      auth:
        privateKey:
          secretRef:
            name: github-packages-app-pem
            key: key
{{- end }}
