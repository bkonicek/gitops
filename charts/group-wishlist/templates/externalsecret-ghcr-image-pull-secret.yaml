apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-image-pull-secret
spec:
  refreshInterval: 30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: ghcr-image-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"x-access-token","password":"{{ "{{" }} .token {{ "}}" }}","auth":"{{ "{{" }} printf "x-access-token:%s" .token | b64enc {{ "}}" }}"}}}
  data:
    - secretKey: token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-read-packages/password
        metadataPolicy: None
        nullBytePolicy: Ignore
