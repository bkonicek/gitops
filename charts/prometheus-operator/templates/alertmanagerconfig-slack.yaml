{{- $slackText := `{{ range .Alerts }}
*Summary:* {{ .Annotations.summary }}
*Description:* {{ .Annotations.description }}
*Severity:* {{ .Labels.severity }}
{{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}
{{ end }}{{ end }}` -}}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-global-config
spec:
  route:
    receiver: "null"
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Synthetic heartbeat alert - would page every repeatInterval otherwise.
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      # Synthetic alert, used only as an inhibition source below.
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      - receiver: {{ .Values.alerting.slack.receiverName | quote }}
        continue: false
  receivers:
    - name: "null"
    - name: {{ .Values.alerting.slack.receiverName | quote }}
      slackConfigs:
        - channel: {{ .Values.alerting.slack.channel | quote }}
          sendResolved: true
          text: {{ $slackText | quote }}
          apiURL:
            name: {{ .Values.alerting.slack.secretName | quote }}
            key: {{ .Values.alerting.slack.secretKey | quote }}
  # Replicates kube-prometheus-stack's default inhibit_rules - see docs/runbooks/alerting.md.
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: "warning|info"
          matchType: "=~"
      equal: ["alertname", "namespace"]
    - sourceMatch:
        - name: severity
          value: warning
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: ["alertname", "namespace"]
    # Keeps severity=info alerts quiet unless a real warning/critical also fires.
    - sourceMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: ["namespace"]
    # Backstop: anything firing suppresses InfoInhibitor itself.
    - targetMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: "="
