{{- $slackText := `{{ range .Alerts }}
*Summary:* {{ .Annotations.summary }}
*Description:* {{ .Annotations.description }}
*Severity:* {{ .Labels.severity }}
{{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}
{{ end }}{{ end }}` -}}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-global-config
spec:
  route:
    receiver: "null"
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # kube-prometheus-stack's synthetic heartbeat alert - route it to null or it
      # pages Slack every repeatInterval forever.
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      # Another synthetic alert, always active whenever a severity=info alert exists in a
      # namespace - it exists only so the inhibitRule below can use it as a source to keep
      # info-level alerts quiet by default. Never meant to be seen by a human.
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      - receiver: {{ .Values.alerting.slack.receiverName | quote }}
        continue: false
  receivers:
    - name: "null"
    - name: {{ .Values.alerting.slack.receiverName | quote }}
      slackConfigs:
        - channel: {{ .Values.alerting.slack.channel | quote }}
          sendResolved: true
          text: {{ $slackText | quote }}
          apiURL:
            name: {{ .Values.alerting.slack.secretName | quote }}
            key: {{ .Values.alerting.slack.secretKey | quote }}
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
      equal: ["alertname", "namespace"]
    # Pairs with the InfoInhibitor route above - keeps severity=info alerts quiet by default,
    # only surfacing them once a real warning/critical fires in the same namespace too.
    - sourceMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: ["namespace"]
